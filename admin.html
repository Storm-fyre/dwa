<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DWA Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">

    <style>
        .admin-wrapper { max-width: 900px; margin: 40px auto; padding: 20px; background: white; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .admin-tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #eee; padding-bottom: 10px; flex-wrap: wrap; }
        .tab-btn { padding: 10px 20px; border: none; background: #eee; cursor: pointer; font-weight: bold; border-radius: 4px; }
        .tab-btn.active { background: #800000; color: #D4AF37; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .admin-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .admin-table th, .admin-table td { padding: 12px; border: 1px solid #ddd; text-align: left; }
        .admin-table th { background-color: #f8f8f8; }
        .admin-form { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; background: #f9f9f9; padding: 15px; border-radius: 5px; border-left: 4px solid #3498db; }
        .admin-form input, .admin-form textarea { padding: 10px; border: 1px solid #ccc; border-radius: 4px; flex: 1; min-width: 200px; }
        .btn-add { background: #3498db; color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 4px; font-weight: bold; }
        .btn-delete { background: #e74c3c; color: white; border: none; padding: 5px 10px; cursor: pointer; border-radius: 4px; }

        /* --- FIXED ADMIN HEADER LAYOUT --- */
        .admin-header {
            background-color: #f8f8f8;
            border-bottom: 1px solid #ddd;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            position: relative;
        }
        .admin-header .main-title {
            margin: 0;
        }
        .admin-back-btn {
            color: #800000;
            font-weight: bold;
            text-decoration: none;
            border: 2px solid #800000;
            padding: 6px 16px;
            border-radius: 5px;
            transition: 0.2s;
        }
        .admin-back-btn:hover {
            background-color: #800000;
            color: #D4AF37;
            text-decoration: none;
        }

        /* Desktop Layout for Header */
        @media (min-width: 768px) {
            .admin-header {
                flex-direction: row;
                justify-content: center;
            }
            .admin-back-btn {
                position: absolute;
                left: 20px;
                top: 50%;
                transform: translateY(-50%); /* perfectly centers it vertically */
            }
        }
    </style>
</head>
<body style="background-color: #f4f4f4;">
    
    <!-- FIXED HEADER -->
    <header class="admin-header">
        <a href="index.html" class="admin-back-btn">← Back to Site</a>
        <h1 class="main-title">DWA Admin Portal</h1>
    </header>

    <!-- LOGIN SCREEN -->
    <div id="login-screen" class="admin-wrapper" style="text-align: center; max-width: 400px;">
        <h2 style="color: #800000;">Admin Access</h2>
        <input type="password" id="admin-password" placeholder="Enter Password" style="width: 100%; padding: 12px; margin: 15px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
        <button id="login-btn" class="btn-add" style="width: 100%; background-color: #800000; color: #D4AF37;">Login</button>
        <p id="login-error" style="color: red; display: none; margin-top: 10px;">Incorrect Password</p>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard-screen" class="admin-wrapper" style="display: none;">
        <div class="admin-tabs">
            <button class="tab-btn active" onclick="switchTab('members')">Permanent Members</button>
            <button class="tab-btn" onclick="switchTab('contributors')">Contributors</button>
            <button class="tab-btn" onclick="switchTab('events')">Events</button>
            <button class="tab-btn" onclick="switchTab('settings')">Site Settings</button>
            <button class="tab-btn" onclick="logout()" style="margin-left: auto; background: #e74c3c; color: white;">Logout</button>
        </div>

        <!-- MEMBERS TAB -->
        <div id="tab-members" class="tab-content active">
            <h2>Manage Permanent Members</h2>
            <div class="admin-form">
                <input type="text" id="new-member-name" placeholder="Member Name (e.g., Ashok Sirsi గారు)">
                <button class="btn-add" onclick="addMember()">Add Member</button>
            </div>
            <table class="admin-table">
                <thead><tr><th>Name</th><th>Action</th></tr></thead>
                <tbody id="members-list"></tbody>
            </table>
        </div>

        <!-- CONTRIBUTORS TAB -->
        <div id="tab-contributors" class="tab-content">
            <h2>Manage Contributors</h2>
            <div class="admin-form">
                <input type="text" id="new-contributor-name" placeholder="Contributor Name">
                <input type="text" id="new-contributor-amount" placeholder="Amount (e.g., 500)">
                <button class="btn-add" onclick="addContributor()">Add Contributor</button>
            </div>
            <table class="admin-table">
                <thead><tr><th>Name</th><th>Amount (₹)</th><th>Action</th></tr></thead>
                <tbody id="contributors-list"></tbody>
            </table>
        </div>

        <!-- EVENTS TAB -->
        <div id="tab-events" class="tab-content">
            <h2>Manage Events</h2>
            <div class="admin-form" style="flex-direction: column;">
                <input type="text" id="new-event-title" placeholder="Event Title">
                <textarea id="new-event-desc" placeholder="Event Description" rows="3"></textarea>
                
                <!-- NEW PHOTO UPLOAD QUEUE -->
                <div style="width: 100%; border: 1px solid #ccc; padding: 15px; border-radius: 4px; background: #fff;">
                    <label style="font-weight: bold; margin-bottom: 10px; display: block; color: #800000;">Upload Event Photo(s) (JPG/PNG)</label>
                    
                    <input type="file" id="new-event-image" accept=".jpg, .jpeg, .png" multiple style="display: none;">
                    <button type="button" id="customUploadBtn" class="btn-clear" style="width: 100%; border: 2px dashed #800000; padding: 12px; font-size: 1rem; cursor: pointer; border-radius: 4px; background: #fdfdfd; font-weight: bold; color: #333;">📸 Tap here to choose photo(s)</button>
                    
                    <div id="photo_queue" style="margin-top: 15px; display: flex; flex-direction: column; gap: 8px;">
                        <!-- Selected photos appear here -->
                    </div>
                </div>

                <button class="btn-add" id="btn-add-event" onclick="addEvent()" style="margin-top: 10px; width: 100%;">Add Event</button>
                <p id="event-upload-status" style="color: #3498db; margin: 0; display: none; text-align: center; font-weight: bold; margin-top: 10px;">Uploading image(s), please wait...</p>
            </div>
            <table class="admin-table">
                <thead><tr><th>Image</th><th>Title</th><th>Action</th></tr></thead>
                <tbody id="events-list"></tbody>
            </table>
        </div>

        <!-- SETTINGS TAB -->
        <div id="tab-settings" class="tab-content">
            <h2>Site Settings</h2>
            <div class="admin-form">
                <label style="font-weight: bold; align-self: center;">Contribution Month Displayed:</label>
                <input type="text" id="setting-month" placeholder="e.g., JUNE">
                <button class="btn-add" onclick="updateMonth()">Update Month</button>
            </div>
        </div>
    </div>

    <!-- Image Compression Script -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/compressorjs/1.2.1/compressor.min.js"></script>
    <script src="admin.js"></script>
</body>
</html>
